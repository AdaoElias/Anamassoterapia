packages:
  - apps/*
  - packages/*

# ------------------------------------------------------------------
# Aprovacao de scripts de build das dependencias (pnpm >= 12).
# 'true' = o script pode rodar, 'false' = bloqueado.
# These packages ship native/prebuilt artifacts: sem isso o Prisma Client
# nao e gerado e o esbuild nao instala o binario da plataforma.
# ------------------------------------------------------------------
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

# ------------------------------------------------------------------
# Catalogo central de versoes.
# Uma unica fonte de verdade: trocar a versao de uma lib aqui atualiza
# todos os pacotes do monorepo de uma vez, sem divergencia entre api/web/shared.
# ------------------------------------------------------------------
catalog:
  # --- toolchain / qualidade ---
  typescript: 5.9.3
  turbo: 2.11.4
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-simple-import-sort: 14.0.0
  globals: 17.12.0
  prettier: 3.9.9
  husky: 9.1.7
  lint-staged: 17.6.0
  rimraf: 6.1.3
  vitest: 5.0.2
  '@vitest/coverage-v8': 5.0.2
  '@types/node': 26.6.3

  # --- runtime api ---
  dotenv: 18.0.4
  tsx: 4.23.15
  fastify: 5.12.5
  '@fastify/cors': 11.3.0
  '@fastify/helmet': 13.1.1
  '@fastify/rate-limit': 11.2.0
  '@fastify/cookie': 11.1.2
  '@fastify/sensible': 6.0.6
  '@fastify/swagger': 9.9.0
  '@fastify/swagger-ui': 6.1.1
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  # pg/@types/pg precisam bater exatamente com o que o @prisma/adapter-pg
  # resolve. Versao divergente instala duas copias dos tipos e o TypeScript
  # passa a recusar o Pool por incompatibilidade de ClientBase.
  pg: 8.23.0
  '@types/pg': 8.23.1
  zod: 4.6.5
  pino: 10.3.1
  pino-pretty: 13.1.3
  pg-boss: 12.35.0
  # SMTP de verdade. A alternativa era escrever o cliente na mao sobre
  # node:net/node:tls; a lib faz Auth, STARTTLS e o parsing de resposta.
  nodemailer: 10.0.14
  # A lib nao embarca os tipos; sem isto o `import nodemailer from 'nodemailer'`
  # seria `any` silencioso.
  '@types/nodemailer': 8.0.2
  '@node-rs/argon2': 2.2.1
  fastify-type-provider-zod: 7.0.0
  openapi-types: 12.1.3

  # --- frontend ---
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-router: 8.4.0
  '@tanstack/react-query': 5.104.0
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.48.0
  vite: 8.3.1
  '@vitejs/plugin-react': 6.1.1
  react-hook-form: 7.89.0
  '@hookform/resolvers': 5.9.1
  date-fns: 4.4.0
